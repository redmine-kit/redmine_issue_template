AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Include:
    - '**/*.rb'
    - '**/*.rake'
    - '**/*.gemspec'
    - '**/Gemfile'
    - 'Gemfile.lint'

Style/Documentation:
  Enabled: false

# Limits a little above RuboCop's defaults: the checks of the template files
# go through their rules one by one, which makes a few methods longer without
# making them hard to read. Disable a cop inline, with the reason, where a
# method really needs more.
Metrics/MethodLength:
  Max: 15

Metrics/AbcSize:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 9

Metrics/PerceivedComplexity:
  Max: 10

Metrics/ClassLength:
  Max: 150
  Exclude:
    - 'test/**/*'

Layout/LineLength:
  Max: 120

# Rake files and test classes are one block by nature.
Metrics/BlockLength:
  Exclude:
    - '**/*.rake'
    - 'test/**/*'
