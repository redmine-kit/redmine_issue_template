# Services for the tests (bin/test). No host ports: the tests run in a
# container on the same network.
services:
  postgres:
    image: postgres:16.16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  # Headless Chromium for the screenshots of the docs (bin/screenshots), only
  # with the "screenshots" profile. Multi-architecture, so it runs on arm64 too.
  chrome:
    image: selenium/standalone-chromium:156.0-chromedriver-156.0-grid-4.54.0-20261123@sha256:cc12c26af3faada21e60cc813cd9cd5ada30f8ce54dec6f9cc1ee66bf2cc125d
    profiles: ["screenshots"]
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 2s
      retries: 60
