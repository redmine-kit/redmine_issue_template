  label_issue_template_format_help: "Format help"
  text_issue_template_format_help: "## Markdown templates\nYAML front matter, then the description the form starts with. `name` and `about` are required.\n```\n---\nname: Feature request\nabout: Suggest a new feature or an improvement.\ntitle: \"[Request] \"\ntracker: Feature\n---\n## Background and goal\n```\n## YAML forms\n`name`, `description` and `body`. The fields of `body` take the place of the description, and the answers are written into the description when the issue is created.\n\n- markdown: text for the description\n- input: a one-line field\n- textarea: a multi-line field; with `render`, the answer is a code block\n- dropdown: a select; `multiple` for several choices\n- checkboxes: a checkbox for each option\n- upload: a file field; `accept` limits the extensions\n\nA field with `link` and no `type` sets an issue field (the target version, a custom field …).\n## Redmine keys\n- `tracker`, `priority`, `category`, `fixed_version`: a name or an ID\n- `is_private`: `true` or `false`\n- `custom_fields`: custom field names and values\n- `fields`: `shown`, `hidden` or `required` for each field\n\nValues set with these keys can't be changed in the form.\n## config.yml\n`blank_issues_enabled` and `contact_links` set up the template chooser."
