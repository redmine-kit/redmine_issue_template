  label_issue_template_format_help: "形式のヘルプ"
  text_issue_template_format_help: "## Markdown テンプレート\nYAML の front matter と、入力画面に最初から入る説明でできています。`name` と `about` は必須です。\n```\n---\nname: 機能の要望\nabout: 新しい機能や改善を提案します。\ntitle: \"[要望] \"\ntracker: 機能\n---\n## 背景と目的\n```\n## YAML フォーム\n`name`、`description`、`body` を持ちます。`body` の入力欄が説明の代わりに出て、回答はチケットを作るときに説明に書きます。\n\n- markdown: 説明の文\n- input: 1 行の入力欄\n- textarea: 複数行の入力欄。`render` があると回答はコードブロック\n- dropdown: 選択欄。`multiple` で複数選択\n- checkboxes: 選択肢ごとのチェックボックス\n- upload: ファイルの欄。`accept` で拡張子を制限\n\n`type` を書かずに `link` を書いた入力欄は、チケットの項目 (対象バージョン、カスタムフィールドなど) に値を入れます。\n## Redmine のキー\n- `tracker`、`priority`、`category`、`fixed_version`: 名前か ID\n- `is_private`: `true` か `false`\n- `custom_fields`: カスタムフィールドの名前と値\n- `fields`: 入力欄ごとに `shown`、`hidden`、`required`\n\nこれらのキーで決めた値は、入力画面では変更できません。\n## config.yml\n`blank_issues_enabled` と `contact_links` で、テンプレートの選択画面を設定します。"
